services:

  # ── PHP-FPM app ──────────────────────────────────────────────────────────────
  app:
    build: .
    container_name: webtopup_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      # Shield image-built deps from the host bind mount, otherwise a
      # Windows host (win32 native npm deps) or an empty clone shadows them.
      - vendor_data:/var/www/html/vendor
      - node_modules_data:/var/www/html/node_modules
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  # ── Nginx ────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: webtopup_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - internal

  # ── MySQL ────────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.4
    container_name: webtopup_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-rootsecret}"
      MYSQL_DATABASE: "${DB_DATABASE:-webtopup}"
      MYSQL_USER: "${DB_USERNAME:-webtopup}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: webtopup_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - internal

  # ── Queue worker ─────────────────────────────────────────────────────────────
  queue:
    build: .
    container_name: webtopup_queue
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - node_modules_data:/var/www/html/node_modules
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  # ── Scheduler (ExpirePayments, hourly) ───────────────────────────────────────
  scheduler:
    build: .
    container_name: webtopup_scheduler
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work", "--verbose"]
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - node_modules_data:/var/www/html/node_modules
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  # ── Vite dev server (optional, only with `--profile dev`) ────────────────────
  vite:
    image: node:22-alpine
    container_name: webtopup_vite
    restart: unless-stopped
    working_dir: /var/www/html
    profiles:
      - dev
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/var/www/html
      - node_modules_data:/var/www/html/node_modules
    ports:
      - "5173:5173"
    networks:
      - internal

volumes:
  db_data:
  redis_data:
  vendor_data:
  node_modules_data:

networks:
  internal:
    driver: bridge
